version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Safe bumps ride together in one PR. Majors are deliberately NOT
      # grouped: one breaking package (Prisma 5->7) blocked an entire batch
      # of security fixes, so majors now arrive one at a time.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
