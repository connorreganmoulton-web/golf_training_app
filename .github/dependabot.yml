version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Safe bumps ride together in one PR. Majors are deliberately NOT
      # grouped: one breaking package (Prisma 5->7) blocked an entire batch
      # of security fixes, so majors now arrive one at a time.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

      # Exception to "majors arrive one at a time": these packages carry peer
      # dependencies on each other and are uninstallable apart. Splitting the
      # React 19 bump produced #13 and #15, neither of which could ever pass
      # npm ci -- each proposed a v19 runtime against a v18 renderer.
      react-major:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [major]
      prisma-major:
        patterns: ["prisma", "@prisma/client"]
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
